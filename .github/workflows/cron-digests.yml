name: Cron digests

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call Telegram daily digest
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${CRON_BASE_URL%/}/api/cron/telegram-daily"

      - name: Call Discord daily digest
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${CRON_BASE_URL%/}/api/cron/discord-daily"
